<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- latar kuning cerah, outline tebal ala sticker -->
  <rect x="3" y="3" width="122" height="122" rx="30" fill="#FFD23F" stroke="#1B1230" stroke-width="6"/>

  <!-- garis "pop!" di atas -->
  <g stroke="#1B1230" stroke-width="4.5" stroke-linecap="round">
    <line x1="64" y1="13" x2="64" y2="20"/>
    <line x1="43" y1="18" x2="47" y2="24"/>
    <line x1="85" y1="18" x2="81" y2="24"/>
  </g>

  <!-- tiga tab/sesi nongol miring dari dalam kotak -->
  <g stroke="#1B1230" stroke-width="4.5" stroke-linejoin="round">
    <g transform="rotate(-14 42 98)">
      <rect x="29" y="44" width="26" height="54" rx="7" fill="#2EC4D6"/>
      <circle cx="42" cy="57" r="3.5" fill="#1B1230" stroke="none"/>
      <rect x="35" y="66" width="14" height="3.5" rx="1.75" fill="#1B1230" stroke="none"/>
    </g>
    <g transform="rotate(14 86 98)">
      <rect x="73" y="40" width="26" height="58" rx="7" fill="#8B6CFF"/>
      <circle cx="86" cy="53" r="3.5" fill="#1B1230" stroke="none"/>
      <rect x="79" y="62" width="14" height="3.5" rx="1.75" fill="#1B1230" stroke="none"/>
    </g>
    <g>
      <rect x="51" y="32" width="26" height="66" rx="7" fill="#FFFFFF"/>
      <circle cx="64" cy="45" r="3.5" fill="#1B1230" stroke="none"/>
      <rect x="57" y="54" width="14" height="3.5" rx="1.75" fill="#1B1230" stroke="none"/>
    </g>
  </g>

  <!-- bayangan keras kotak -->
  <rect x="31" y="80" width="79" height="36" rx="8" fill="#1B1230"/>
  <!-- kotak: badan, bibir atas, label -->
  <g stroke="#1B1230" stroke-width="4.5" stroke-linejoin="round">
        <rect x="24" y="74" width="80" height="36" rx="8" fill="#FF5D5D"/>
    <rect x="18" y="64" width="92" height="16" rx="6" fill="#FF8E8E"/>
    <rect x="50" y="88" width="28" height="9" rx="4.5" fill="#FFFFFF"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
