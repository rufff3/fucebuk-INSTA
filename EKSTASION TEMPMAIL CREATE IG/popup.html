<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Meta/IG OTP Grabber</title>
  <style>
    * { box-sizing: border-box; }
    body {
      width: 580px;
      margin: 0;
      padding: 14px;
      background: #111111;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      font-size: 15px;
      font-weight: bold;
      border-bottom: 1px solid #3a3b3c;
      padding-bottom: 10px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .server-panel {
      background: #1c1e21;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #3a3b3c;
      margin-bottom: 10px;
    }
    .control-panel {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      margin-bottom: 10px;
      background: #1c1e21;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3a3b3c;
    }
    .control-col-input { flex: 0 0 110px; }
    .control-col-btn { flex: 1; }
    .control-col-stop { flex: 0 0 auto; }
    .inject-panel {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    label {
      font-size: 11px;
      font-weight: bold;
      color: #b0b3b8;
      display: block;
      margin-bottom: 5px;
    }
    select, input[type="number"], input[type="password"], input[type="text"] {
      width: 100%;
      padding: 8px 10px;
      background: #242526;
      border: 1px solid #3e4042;
      border-radius: 6px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }
    input[readonly] {
      background: #18191a;
      color: #8a8d91;
      cursor: not-allowed;
    }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { opacity: 0.85; }
    .btn-primary { background: #1877f2; color: #fff; }
    .btn-success { background: #42b72a; color: #fff; }
    .btn-inject { background: #207be6; color: #fff; flex: 1; padding: 10px; font-size: 12px; }
    .btn-inject-otp { background: #28a745; color: #fff; flex: 1; padding: 10px; font-size: 12px; }
    .btn-grab-username { background: #d62976; color: #fff; flex: 1; padding: 10px; font-size: 12px; }
    .btn-stop { background: #fa3e3e; color: #fff; }
    .btn-save { background: #2e89ff; color: #fff; padding: 4px 8px; font-size: 11px; }
    .btn-copy { background: #3a3b3c; color: #fff; padding: 4px 8px; font-size: 11px; }
    .btn-danger { background: #fa3e3e; color: #fff; }
    .btn-panel { background: #3a3b3c; color: #fff; padding: 4px 10px; font-size: 11px; border-radius: 4px; }
    .table-container {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #3e4042;
      border-radius: 6px;
      background: #18191a;
      margin-bottom: 14px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    thead {
      background: #242526;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    th {
      padding: 8px 10px;
      text-align: left;
      color: #b0b3b8;
      border-bottom: 1px solid #3e4042;
      font-weight: 600;
    }
    td {
      padding: 8px 10px;
      border-bottom: 1px solid #2d3033;
      vertical-align: middle;
    }
    .email-col {
      font-family: monospace;
      color: #e4e6eb;
      word-break: break-all;
    }
    .otp-col {
      font-family: monospace;
      font-weight: bold;
      font-size: 14px;
      color: #42b72a;
      letter-spacing: 1px;
    }
    .storage-section {
      background: #1c1e21;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #3a3b3c;
      margin-bottom: 10px;
    }
    .storage-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
    }
    textarea {
      width: 100%;
      height: 75px;
      background: #242526;
      border: 1px solid #3e4042;
      border-radius: 6px;
      color: #42b72a;
      font-family: monospace;
      font-size: 12px;
      padding: 8px;
      resize: vertical;
    }
  </style>
</head>
<body>

  <div class="header">
    <span>KONTOLLODON</span>
    <div class="header-actions">
      <span id="monitor-status" style="font-size: 11px; font-weight: normal; color: #b0b3b8;">Idle</span>
      <button id="btn-toggle-panel" class="btn-panel" title="Pindah ke Panel Samping">Side Panel</button>
    </div>
  </div>

  <div class="storage-section">
    <div class="storage-header">
      <span style="font-weight: bold;">KATA SANDI</span>
      <div style="display: flex; gap: 6px;">
        <button id="btn-edit-password" class="btn-primary" style="padding: 4px 10px;">Edit</button>
        <button id="btn-save-password" class="btn-success" style="padding: 4px 10px; display: none;">Simpan</button>
      </div>
    </div>
    <input type="password" id="input-password" readonly placeholder="Masukkan sandi di sini...">
  </div>

  <div class="server-panel">
    <label>PILIHAN WEB TEMPMAIL</label>
    <select id="select-provider">
      <option value="user_web">DOMAIN PRIBADI</option>
      <option value="mnx_family">MNX Family Mailer</option>
      <option value="orify_mail">OrifyMail</option>
      <option value="instant_temp">Instant Temp Email</option>
      <option value="random">Random</option>
    </select>
  </div>

  <div class="control-panel">
    <div class="control-col-input">
      <label>JUMLAH EMAIL</label>
      <input id="input-count" type="number" value="5" min="1" max="50">
    </div>
    <div class="control-col-btn">
      <button id="btn-generate" class="btn-primary" style="width: 100%; height: 35px;">GENERATE & PANTAU OTP</button>
    </div>
    <div class="control-col-stop">
      <button id="btn-stop" class="btn-stop" style="height: 35px; display: none;">STOP</button>
    </div>
  </div>

  <div class="inject-panel">
    <button id="btn-inject-email" class="btn-inject">INJECT EMAIL</button>
    <button id="btn-inject-otp" class="btn-inject-otp">INJECT OTP</button>
    <button id="btn-grab-username" class="btn-grab-username">GET USERNAME</button>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width: 48%;">EMAIL TARGET</th>
          <th style="width: 24%;">KODE OTP</th>
          <th style="width: 28%;">AKSI</th>
        </tr>
      </thead>
      <tbody id="email-list-body">
        <tr>
          <td colspan="3" style="text-align: center; color: #777; padding: 20px;">Belum ada email yang di-generate.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="storage-section">
    <div class="storage-header">
      <span style="font-weight: bold;">Penampungan Email Tersimpan (<span id="saved-count">0</span>)</span>
      <div style="display: flex; gap: 6px;">
        <button id="btn-import-saved" class="btn-success" style="padding: 4px 10px;">Import ke Pantauan</button>
        <button id="btn-copy-saved" class="btn-primary" style="padding: 4px 10px;">Salin Semua</button>
        <button id="btn-delete-saved" class="btn-danger" style="padding: 4px 10px;">Hapus Semua</button>
      </div>
    </div>
    <textarea id="saved-emails-box" placeholder="Alamat email tersimpan akan muncul di sini..."></textarea>
  </div>

  <div class="storage-section">
    <div class="storage-header">
      <span style="font-weight: bold;">Hasil Username IG + Email (<span id="saved-usernames-count">0</span>)</span>
      <div style="display: flex; gap: 6px;">
        <button id="btn-copy-usernames" class="btn-primary" style="padding: 4px 10px;">Salin Semua</button>
        <button id="btn-delete-usernames" class="btn-danger" style="padding: 4px 10px;">Hapus Semua</button>
      </div>
    </div>
    <textarea id="saved-usernames-box" placeholder="Hasil tarik username email akan muncul di sini (username email)..."></textarea>
  </div>

  <script src="popup.js"></script>
</body>
</html>
